services:
  - type: web
    name: stylesync-api
    runtime: node
    plan: free
    region: singapore

    buildCommand: npm ci
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production

      - key: TRUST_PROXY
        value: "1"

      - key: DB_SSL
        value: "true"

      - key: DB_HOST
        sync: false

      - key: DB_PORT
        sync: false

      - key: DB_USER
        sync: false

      - key: DB_PASSWORD
        sync: false

      - key: DB_NAME
        sync: false

      - key: DB_POOL_SIZE
        value: "5"

      - key: SESSION_SECRET
        generateValue: true

      - key: CLIENT_ORIGINS
        sync: false

  - type: web
    name: stylesync-client
    runtime: static

    buildCommand: cd client && npm ci && npm run build

    staticPublishPath: ./client/dist

    envVars:
      - key: VITE_API_URL
        sync: false

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
